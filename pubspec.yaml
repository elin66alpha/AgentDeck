name: relay
description: "A private Flutter control surface for local CLI coding agents."
publish_to: "none"

version: 0.1.7+17

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.0
  http: ^1.2.0
  cryptography: ^2.7.0
  mobile_scanner: ^7.2.0
  flutter_local_notifications: ^21.0.0
  image: ^4.8.0
  zxing2: ^0.2.4
  file_picker: ^11.0.2
  path_provider: ^2.1.4
  web: ^1.1.1
  flutter_markdown_plus: ^1.0.7
  # Already pulled in by flutter_markdown_plus; declared directly so chat
  # rendering can add its own inline syntax (the search-hit marker).
  markdown: ^7.3.1
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  xterm: ^4.0.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/agent_icons/
    - assets/fonts/OFL.txt
  fonts:
    - family: RelayTerminalMono
      fonts:
        - asset: assets/fonts/CascadiaMonoPL.ttf
